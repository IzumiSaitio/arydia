name: Publish web only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arydia-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser assets
        run: |
          unzip -nq web/assets.zip -d web/dist
          test -f web/dist/index.html
          test -f web/dist/art/music-vignette-reference.png
          test -f web/dist/intro/thades-front-en.png
          test -z "$(find web/dist -type f \( -name '*.apk' -o -name '*.jks' -o -name '*.keystore' \) -print)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        id: deploy
